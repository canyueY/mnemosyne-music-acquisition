[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-music-acquisition"
version = "0.5.0"
description = "Mnemosyne Music Acquisition — Independent music data acquisition engine (Netease-ready, host-agnostic)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "canyueY" }]
keywords = ["mnemosyne", "music", "netease", "acquisition", "agent"]
dependencies = [
  "pydantic>=2.7.0",
  "cryptography>=42.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.0"]
http = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "httpx>=0.27.0"]
qr = ["qrcode[pil]>=7.4"]
secure = ["keyring>=25.0"]
all = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "qrcode[pil]>=7.4",
  "keyring>=25.0",
]

[project.scripts]
mnemosyne-music = "music_acquisition.cli:main"

[project.urls]
Documentation = "docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
music_acquisition = ["resources/*.json", "resources/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
