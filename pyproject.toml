[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemosyne-music-acquisition"
version = "0.4.2"
description = "Mnemosyne Music Acquisition — Independent music data acquisition engine (Netease-ready, host-agnostic)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "canyueY" }]
keywords = ["mnemosyne", "music", "netease", "acquisition", "agent"]
dependencies = [
  "pydantic>=2.7.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
http = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "httpx>=0.27.0"]
qr = ["qrcode[pil]>=7.4"]

[project.scripts]
mnemosyne-music = "music_acquisition.cli:main"

[project.urls]
Documentation = "docs/ARCHITECTURE.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
